[project]
name = "agent-reliability-lab"
version = "0.1.0"
description = "Reproducible tool-use reliability and adversarial benchmarks over synthetic business data"
readme = "README.md"
authors = [
    { name = "Neil", email = "neilpathak05@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "faker>=40.37.0",
    "ollama>=0.6.2",
    "pydantic>=2.13.5",
    "sqlalchemy>=2.0.52",
]

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[project.scripts]
arl = "agent_reliability_lab.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.5",
]
